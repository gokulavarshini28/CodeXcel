function togglePassword(){let x=$('password');x.type=x.type==='password'?'text':'password';event.target.textContent=x.type==='password'?'Show':'Hide'}
function login(e){
 e.preventDefault();let u=$('username').value.trim(),p=$('password').value,err='';

 return `<div class="profile"><div class="profile-head"><div class="profile-id"><div class="avatar">${initials(x.name)}</div><div><div class="profile-name">${x.name}</div><div class="muted">${x.role} • ${x.department}</div><span class="status active-status">ACTIVE</span></div></div><button class="primary" onclick="openProfile('${x.id}')">View Full Profile</button></div>
 <div class="grid" style="margin-top:15px"><div class="card"><div class="label">Attendance</div><div class="metric">${Math.round(x.present/(x.present+x.absent)*100)}%</div></div><div class="card"><div class="label">Performance</div><div class="metric">${x.performance}%</div></div><div class="card"><div class="label">Hours / Day</div><div class="metric">${x.avgHours}</div></div><div class="card"><div class="label">Projects</div><div class="metric">${x.completed}/${x.assigned}</div></div></div>
 <div class="section card"><div class="section-title"><h3>My Information</h3></div><div class="profile-grid">${info('Employee ID',x.id)}${info('Email',x.email)}${info('Phone',x.phone)}${info('Location',x.location)}${info('Manager',x.manager)}${info('Experience',x.experience)}</div></div></div>`;
}
function info(k,v){return `<div class="info"><small>${k}</small><b>${v}</b></div>`}
function miniRows(arr){return `<div class="table-wrap"><table class="table"><thead><tr><th>Employee</th><th>Department</th><th>Role</th><th>Status</th></tr></thead><tbody>${arr.map(x=>`<tr><td><b>${x.name}</b><br><span class="muted">${x.id}</span></td><td>${x.department}</td><td>${x.role}</td><td><span class="status active-status">Active</span></td></tr>`).join('')}</tbody></table></div>`}
function directory(){
 let arr=visibleEmployees();
 $('page').innerHTML=`<div class="card"><div class="toolbar"><input id="search" oninput="filterDirectory()" placeholder="Search name, ID, email, department or role..."><select id="dept" onchange="filterDirectory()"><option value="">All departments</option>${[...new Set(employees.map(x=>x.department))].sort().map(d=>`<option>${d}</option>`).join('')}</select>${currentUser.type==='admin'?`<label style="display:flex;align-items:center;gap:7px;padding:0 8px;color:#9cafc3;font-size:12px"><input id="inactiveToggle" type="checkbox" onchange="toggleInactive()"> Show inactive</label>`:''}</div><div id="directoryTable"></div></div>`;
 filterDirectory();
}
function toggleInactive(){showInactive=$('inactiveToggle').checked;filterDirectory()}
function filterDirectory(){
 let q=($('search')?.value||'').toLowerCase(),d=$('dept')?.value||'',arr=visibleEmployees().filter(x=>(!q||[x.id,x.name,x.email,x.department,x.role,x.phone,x.location].join(' ').toLowerCase().includes(q))&&(!d||x.department===d));
 $('directoryTable').innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>Employee</th><th>Department</th><th>Role</th><th>Contact</th><th>Status</th><th>Action</th></tr></thead><tbody>${arr.map(x=>`<tr><td><b>${x.name}</b><br><span class="muted">${x.id}</span></td><td>${x.department}</td><td>${x.role}</td><td>${x.email}<br>${x.phone}</td><td><span class="status ${x.status==='Active'?'active-status':'inactive-status'}">${x.status}</span></td><td><div class="actions"><button onclick="openProfile('${x.id}')">Profile</button>${currentUser.type==='admin'?`<button onclick="editEmployee('${x.id}')">Edit</button><button onclick="toggleStatus('${x.id}')">${x.status==='Active'?'Deactivate':'Activate'}</button><button class="red" onclick="removeEmployee('${x.id}')">Remove</button>`:''}</div></td></tr>`).join('')||'<tr><td colspan="6" class="muted">No matching employees found.</td></tr>'}</tbody></table></div>`;
}
function departments(){
 let groups={};employees.filter(x=>x.status==='Active').forEach(x=>(groups[x.department]??=[]).push(x));
 $('page').innerHTML=Object.entries(groups).map(([d,a])=>`<div class="section card"><div class="section-title"><h3>${d}</h3><span class="badge">${a.length} employees</span></div>${miniRows(a)}</div>`).join('');
}
function departmentBars(){
 let groups={};employees.filter(x=>x.status==='Active').forEach(x=>(groups[x.department]??=[]).push(x));
 let vals=Object.entries(groups).map(([d,a])=>[d,Math.round(a.reduce((s,x)=>s+x.performance,0)/a.length)]);
 let max=Math.max(...vals.map(x=>x[1]));
 return `<div class="bars">${vals.map(([d,v])=>`<div class="bar-col"><div class="bar" style="height:${Math.max(35,v/max*160)}px"></div><b>${v}%</b><span>${d.split(' ')[0]}</span></div>`).join('')}</div>`;
}
function analytics(){
 let active=employees.filter(x=>x.status==='Active'),avg=Math.round(active.reduce((s,x)=>s+x.performance,0)/active.length),assigned=active.reduce((s,x)=>s+x.assigned,0),completed=active.reduce((s,x)=>s+x.completed,0),hours=active.reduce((s,x)=>s+x.avgHours*22,0);
 $('page').innerHTML=`<div class="grid"><div class="card"><div class="label">Average Performance</div><div class="metric">${avg}%</div></div><div class="card"><div class="label">Projects Assigned</div><div class="metric">${assigned}</div></div><div class="card"><div class="label">Projects Completed</div><div class="metric">${completed}</div></div><div class="card"><div class="label">Estimated Monthly Hours</div><div class="metric">${Math.round(hours)}</div></div></div><div class="section card"><div class="section-title"><h3>Performance by Department</h3></div>${departmentBars()}</div>`;
}
function openProfile(id){
 let x=employees.find(e=>e.id===id);if(!x)return;
 let att=Math.round(x.present/(x.present+x.absent)*100), rate=Math.round(x.completed/x.assigned*100);
 $('modalTitle').textContent='Full Employee Profile';
 $('modalBody').innerHTML=`<div class="profile-head"><div class="profile-id"><div class="avatar">${initials(x.name)}</div><div><div class="profile-name">${x.name}</div><div class="muted">${x.role} • ${x.department}</div><span class="status ${x.status==='Active'?'active-status':'inactive-status'}">${x.status.toUpperCase()}</span></div></div></div><div class="profile-grid">${info('Employee ID',x.id)}${info('Email',x.email)}${info('Phone',x.phone)}${info('Location',x.location)}${info('Manager',x.manager)}${info('Experience',x.experience)}${info('Present Days',x.present)}${info('Absent Days',x.absent)}${info('Attendance',att+'%')}${info('Average Hours / Day',x.avgHours)}${info('Performance',x.performance+'%')}${info('Projects',x.completed+'/'+x.assigned)}${info('Project Completion',rate+'%')}</div>${currentUser.type==='admin'?`<div style="display:flex;gap:8px;margin-top:16px"><button class="primary" onclick="closeModal();editEmployee('${x.id}')">Edit Profile</button><button class="ghost" onclick="toggleStatus('${x.id}');closeModal()"> ${x.status==='Active'?'Deactivate':'Activate'} </button></div>`:''}`;
 $('modal').classList.remove('hidden');
}
function openEmployeeModal(id=null){
 let x=id?employees.find(e=>e.id===id):null;
 $('modalTitle').textContent=x?'Edit Employee':'Add Employee';
 let v=(k)=>x?.[k]||'';
 $('modalBody').innerHTML=`<form onsubmit="saveEmployee(event,'${id||''}')"><div class="form-grid">
 ${field('Employee ID','id',x?v('id'):'EMP'+String(employees.length+1).padStart(3,'0'),id?'readonly':'')}
 ${field('Full Name','name',v('name'))}${field('Email','email',v('email'))}${field('Phone','phone',v('phone'))}
 ${field('Department','department',v('department'))}${field('Role','role',v('role'))}${field('Location','location',v('location'))}${field('Manager','manager',v('manager'))}
 ${field('Present Days','present',x?v('present'):22)}${field('Absent Days','absent',x?v('absent'):1)}${field('Avg Hours / Day','avgHours',x?v('avgHours'):8.5)}${field('Experience','experience',x?v('experience'):'2 years')}
 ${field('Projects Assigned','assigned',x?v('assigned'):3)}${field('Projects Completed','completed',x?v('completed'):2)}${field('Performance %','performance',x?v('performance'):88)}
 </div><div style="margin-top:16px"><button class="primary wide" type="submit">${x?'Save Changes':'Create Employee'}</button></div></form>`;
 $('modal').classList.remove('hidden');
}
function field(label,key,val,extra=''){return `<div class="field"><label>${label}</label><input name="${key}" value="${String(val).replace(/"/g,'&quot;')}" ${extra} required></div>`}
function editEmployee(id){openEmployeeModal(id)}
function saveEmployee(e,id){
 e.preventDefault();let f=new FormData(e.target),o=Object.fromEntries(f.entries());
 if(id){let x=employees.find(a=>a.id===id);Object.keys(o).forEach(k=>{x[k]=o[k]});['present','absent','avgHours','assigned','completed','performance'].forEach(k=>x[k]=Number(x[k]));}
 else{if(employees.some(x=>x.id===o.id)){alert('Employee ID already exists');return}o.present=Number(o.present);o.absent=Number(o.absent);o.avgHours=Number(o.avgHours);o.assigned=Number(o.assigned);o.completed=Number(o.completed);o.performance=Number(o.performance);o.status='Active';employees.push(o)}
 save();closeModal();toast(id?'Employee updated successfully':'Employee added successfully');render();
}
function toggleStatus(id){let x=employees.find(e=>e.id===id);if(!x)return;x.status=x.status==='Active'?'Inactive':'Active';save();toast(x.name+' is now '+x.status);render()}
function removeEmployee(id){let x=employees.find(e=>e.id===id);if(!x)return;if(confirm('Remove '+x.name+' from the directory?')){employees=employees.filter(e=>e.id!==id);save();toast('Employee removed');render()}}
function closeModal(){$('modal').classList.add('hidden')}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}
</script>
</body>
</html>
